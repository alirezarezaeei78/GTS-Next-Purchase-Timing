   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="420.12" y="156.375881" transform="rotate(-0 420.12 156.375881)">Five complementary members</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'" transform="translate(286.704234 174.374088)">Graph encoder • LSTM • GRU • Boosting • Window mean</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'" transform="translate(295.785539 186.554691)">Recurrent members: select direct / residual / average</text>
   </g>
   <g id="text_11">
