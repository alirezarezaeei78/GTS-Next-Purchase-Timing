   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="258.3" y="48.267881" transform="rotate(-0 258.3 48.267881)">Five separate phases</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'" transform="translate(202.140352 57.950088)">Fit → early stop → select</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'" transform="translate(205.221703 70.130691)">→ stack weights → test</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="488.475" y="48.267881" transform="rotate(-0 488.475 48.267881)">Training-only representations</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'" transform="translate(405.657047 57.950088)">Feature ranking • customer profiles</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'" transform="translate(419.365102 70.130691)">Fixed co-purchase item graph</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="107.64" y="156.375881" transform="rotate(-0 107.64 156.375881)">Bounded input search</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'" transform="translate(21.059906 174.374088)">Number of channels • window length</text>
